name: Data Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test data validation failure cases
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate event data and verification log
        run: python3 scripts/validate-data.py
